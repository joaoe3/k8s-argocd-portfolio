apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joaoe3/k8s-argocd-portfolio.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
